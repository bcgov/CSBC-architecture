name: Deploy to GitHub Pages

on:
  # Every push to main republishes the site.
  push:
    branches: [main]
  # ...and you can also trigger it by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions this job needs. `pages: write` and `id-token: write`
# are what let the deploy step talk to the Pages service without a PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run finish rather than cancelling
# it — a half-cancelled deploy can leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # There is no build step. This repository holds the built site itself, so
  # the workflow uploads the checkout as-is. The build lives with the source,
  # which is a separate repository; see README.md.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
