name: Deploy to GitHub Pages

on:
  # Every push to main republishes the site.
  push:
    branches: [main]
  # ...and you can also trigger it by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions this job needs. `pages: write` and `id-token: write`
# are what let the deploy step talk to the Pages service without a PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run finish rather than cancelling
# it — a half-cancelled deploy can leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`) — installs exactly what's in
      # package-lock.json, so CI builds what you tested locally.
      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
